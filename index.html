<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFHIMNA</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bokor&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
/* ===== TEMA ===== */
:root,[data-theme="dark"]{
  --bg1:#020617;--bg2:#000;--card:rgba(2,6,23,.92);--panel:#020617;--border:#334155;--border2:#1e293b;
  --text:#e5e7eb;--muted:#94a3b8;--hover:#1e293b;--overlay:rgba(2,6,23,.98);--shadow:rgba(0,0,0,.6);
  --accent:#38bdf8;--accent2:#22c55e;--wrongbg:#3f0d0d;--orb1:#2563eb;--orb2:#22c55e;--title:#e5e7eb;
  --g-bg:#22c55e;--g-text:#04210f;--g-hover:#4ade80;--g-glow:rgba(34,197,94,.5);--g-glow0:rgba(34,197,94,0);
  --act-bg:linear-gradient(135deg,#0e7490,#1d4ed8);--act-text:#f0f9ff;--act-sh:rgba(14,116,144,.45);--act-sh-h:rgba(56,189,248,.5);
}
[data-theme="light"]{
  --bg1:#f8fafc;--bg2:#dbeafe;--card:rgba(255,255,255,.9);--panel:#ffffff;--border:#cbd5e1;--border2:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--hover:#e0f2fe;--overlay:rgba(241,245,249,.98);--shadow:rgba(30,64,175,.18);
  --accent:#0284c7;--accent2:#16a34a;--wrongbg:#fee2e2;--orb1:#60a5fa;--orb2:#4ade80;--title:#0f172a;
  --g-bg:#1e3a8a;--g-text:#ffffff;--g-hover:#172554;--g-glow:rgba(30,58,138,.45);--g-glow0:rgba(30,58,138,0);
  --act-bg:#1e3a8a;--act-text:#ffffff;--act-sh:rgba(30,58,138,.35);--act-sh-h:rgba(30,58,138,.5);
}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(circle at top,var(--bg1),var(--bg2));
  display:flex;justify-content:center;align-items:center;
  color:var(--text);font-family:"Times New Roman",serif;
  opacity:0;transition:opacity .8s ease,background .5s ease,color .4s ease;
  overflow-x:hidden;
}
body.page-ready{opacity:1}

/* ===== Efek latar: orb melayang ===== */
.orb{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none;animation:floatOrb 14s ease-in-out infinite}
.orb.o1{background:var(--orb1);top:-80px;left:-80px}
.orb.o2{background:var(--orb2);bottom:-90px;right:-70px;animation-delay:-6s}
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.2)}}

.quiz-box{
  position:relative;z-index:1;overflow:hidden;overflow:clip;
  width:100%;max-width:720px;margin:16px;
  background:var(--card);backdrop-filter:blur(10px);
  border:1px solid var(--border2);border-radius:22px;padding:25px;
  box-shadow:0 0 40px var(--shadow);
  transition:background .5s ease,border-color .4s ease;
  animation:boxGlow 5s ease-in-out infinite;
}
@keyframes boxGlow{0%,100%{box-shadow:0 0 40px var(--shadow)}50%{box-shadow:0 0 55px var(--shadow),0 0 28px rgba(56,189,248,.25)}}
.quiz-box::before{ /* garis cahaya berjalan */
  content:"";position:absolute;top:0;left:-50%;width:50%;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:sweep 3.5s linear infinite;
}
@keyframes sweep{to{left:100%}}

#timerBox{
  text-align:center;margin-bottom:16px;padding:12px;border-radius:16px;
  background:var(--panel);border:1px solid var(--border);font-weight:bold;
}
#progressWrap{margin-top:8px;height:8px;background:var(--panel);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
#progressBar{height:100%;width:100%;transition:width .3s linear,background .3s;position:relative;overflow:hidden}
#progressBar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 1.6s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.progress-safe{background:#22c55e}
.progress-warn{background:#eab308}
.progress-danger{background:#ef4444}
#timerBox.danger{color:#ef4444}
#questionText{font-family:"Amiri",serif;font-size:1.45rem;margin:22px 0;text-align:center}

.answer-buttons{display:grid;gap:14px}
.answer-buttons button{
  position:relative;overflow:hidden;
  padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:16px;
  color:var(--text);font-size:1.2rem;cursor:pointer;
  transition:.25s ease;font-family:"Amiri",serif;
  animation:rise .45s ease both;
}
.answer-buttons button:nth-child(2){animation-delay:.06s}
.answer-buttons button:nth-child(3){animation-delay:.12s}
.answer-buttons button:nth-child(4){animation-delay:.18s}
.answer-buttons button:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.answer-buttons button:hover:not(:disabled){background:var(--hover);transform:translateX(6px);border-color:var(--accent);box-shadow:0 0 14px rgba(56,189,248,.25)}
.answer-buttons button.correct{border-color:#22c55e;color:#22c55e;box-shadow:0 0 12px rgba(34,197,94,.45);animation:pop .5s ease}
.answer-buttons button.wrong{background:var(--wrongbg);border-color:#ef4444;color:#ef4444;animation:wiggle .4s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ripple */
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

.score-board{margin-top:20px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--border);text-align:center}
.bump{display:inline-block;animation:bump .45s ease}
@keyframes bump{50%{transform:scale(1.5);color:var(--accent)}}

#result{margin-top:18px;padding:15px;border-radius:16px;border:1px solid var(--border);opacity:0;transform:translateY(10px);transition:.45s ease}
#result.show{opacity:1;transform:translateY(0)}
.correct-text{color:#22c55e;font-weight:bold}
.wrong-text{color:#ef4444;font-weight:bold}
.explain{
  margin-top:10px;font-family:"Amiri",serif;background:var(--panel);padding:12px;
  border-radius:12px;border-left:4px solid var(--accent);line-height:1.7;text-align:justify;
}

#nextBtn{
  position:sticky;bottom:12px;z-index:5;overflow:hidden;margin-top:22px;width:100%;padding:14px;border:none;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.35);
  background:linear-gradient(135deg,#2563eb,#38bdf8);color:white;cursor:pointer;
  opacity:0;transform:translateY(8px);transition:.3s ease;
}
#nextBtn:not(.hidden){opacity:1;transform:translateY(0)}
[data-theme="light"] #nextBtn,[data-theme="light"] #closeReview{background:#1e3a8a !important}
#nextBtn:hover{box-shadow:0 8px 22px rgba(37,99,235,.5);transform:translateY(-2px)}
.hidden{display:none}

.fade-enter{opacity:0;transform:translateY(12px)}
.fade-enter-active{opacity:1;transform:translateY(0);transition:.4s ease}
.timer-warning{animation:pulseRed 1s infinite,shake .3s infinite}
@keyframes pulseRed{0%{background:var(--panel)}50%{background:var(--wrongbg)}100%{background:var(--panel)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-2px)}50%{transform:translateX(2px)}75%{transform:translateX(-2px)}100%{transform:translateX(0)}}

#startScreen{text-align:center}
#startScreen h2{margin:.3em 0}
.glow-title{
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  font-size:2rem;animation:flow 4s linear infinite;
}
@keyframes flow{to{background-position:200% center}}

/* ===== Pemilih tema ===== */
.theme-switch{display:flex;width:max-content;margin:0 0 12px auto;gap:4px;padding:3px;border:1px solid var(--border);border-radius:999px;background:var(--panel)}
.theme-switch button{
  width:30px;height:30px;padding:0;border:none;border-radius:50%;background:transparent;opacity:.55;
  cursor:pointer;font-size:1.05rem;line-height:1;transition:.3s ease;
}
.theme-switch button:hover{opacity:1;transform:scale(1.1)}
.theme-switch button.active{opacity:1;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px rgba(56,189,248,.45)}

/* ===== Kartu info ===== */
.info-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:20px 0}
.icard{
  grid-column:span 2;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  min-height:150px;padding:14px 10px 12px;border:2px solid #d8b45a;border-radius:14px;text-align:center;color:#f6e3a8;
  transition:transform .3s ease,box-shadow .3s ease;animation:rise .6s ease both;
}
.icard:nth-child(4){grid-column:2/4}
.icard:nth-child(5){grid-column:4/6}
.icard:nth-child(2){animation-delay:.08s}.icard:nth-child(3){animation-delay:.16s}
.icard:nth-child(4){animation-delay:.24s}.icard:nth-child(5){animation-delay:.32s}
.icard::before{content:"";position:absolute;inset:5px;border:1px solid rgba(240,210,130,.5);border-radius:9px;pointer-events:none}
.icard::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);transition:left .7s ease}
.icard:hover{transform:translateY(-5px) scale(1.03)}
.icard:hover::after{left:130%}
.icard{overflow:hidden}
.icard small{font-family:"Playfair Display",serif;font-size:.72rem;letter-spacing:.08em;font-weight:600;text-transform:uppercase;color:#f3e2b0;margin-top:4px}
.icard b{font-family:"Playfair Display","Amiri",serif;font-weight:700;font-size:1.25rem;line-height:1.2;color:#f8e7b4;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.icard b small{font-size:.95rem;margin:0 0 0 6px;text-transform:none;letter-spacing:0;color:inherit}
.icard .ar{font-family:"Amiri",serif;font-size:1rem;color:#f3e2b0;margin:0;letter-spacing:0;text-transform:none;font-weight:400}
.c-tema{background:linear-gradient(145deg,#0f7a56,#064e3b 65%,#033a2c);box-shadow:0 0 18px rgba(16,185,129,.4)}
.c-tema b{font-family:"Amiri",serif;font-size:2.3rem}
.c-kitab{background:linear-gradient(145deg,#1f56b0,#0b2d6b);box-shadow:0 0 18px rgba(59,130,246,.45)}
.c-fashl{background:linear-gradient(145deg,#12a0a0,#075e66);box-shadow:0 0 18px rgba(20,184,166,.4)}
.c-fashl b{font-size:3rem}
.c-jumlah{background:linear-gradient(145deg,#8b3fe0,#4c1d95);box-shadow:0 0 18px rgba(168,85,247,.45)}
.c-jumlah b{font-size:2.6rem}
.c-waktu{background:linear-gradient(145deg,#e6ac2c,#9a6310);box-shadow:0 0 18px rgba(245,158,11,.45)}
.c-waktu b{font-size:2.6rem}
@media(max-width:560px){
  .info-grid{grid-template-columns:1fr 1fr;gap:10px}
  .icard,.icard:nth-child(4),.icard:nth-child(5){grid-column:auto}
  .icard:nth-child(5){grid-column:1/-1}
  .c-tema b{font-size:2rem}.c-fashl b,.c-jumlah b,.c-waktu b{font-size:2.2rem}
}
.info-rule{color:var(--muted);font-size:.95rem;margin:0 0 16px}

#startBtn{
  position:relative;overflow:hidden;padding:14px 26px;font-size:1.1rem;border:none;border-radius:16px;
  background:var(--g-bg);color:var(--g-text);cursor:pointer;transition:.25s ease;
  animation:breathe 2s ease-in-out infinite;
}
#startBtn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:glint 2.8s ease-in-out infinite}
@keyframes glint{0%{left:-70%}60%,100%{left:130%}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 var(--g-glow)}50%{box-shadow:0 0 0 12px var(--g-glow0)}}
#startBtn:hover{background:var(--g-hover);transform:translateY(-2px)}
#startBtn:disabled{opacity:.6;animation:none}

.fade-scale{opacity:0;transform:scale(.96) translateY(10px);transition:.45s ease}
.fade-scale.show{opacity:1;transform:scale(1) translateY(0)}
.question-fade{opacity:0;transform:translateY(12px)}
.question-fade.show{opacity:1;transform:translateY(0);transition:.35s ease}
.timer-danger{animation:pulseRed .6s infinite,shake .15s infinite}
#reviewBox{opacity:0;transform:translateY(20px);transition:opacity .45s ease,transform .45s ease}
#reviewBox.show{opacity:1;transform:translateY(0)}
#reviewOverlay{opacity:0;transform:translateY(20px) scale(.98);transition:opacity .45s ease,transform .45s ease}
#reviewOverlay.show{opacity:1;transform:translateY(0) scale(1)}

#countdownOverlay{
  position:fixed;inset:0;background:var(--overlay);display:flex;justify-content:center;align-items:center;
  z-index:9999;opacity:0;transition:opacity .4s ease;
}
#countdownOverlay.show{opacity:1}
#countdownNum{
  font-size:6rem;font-weight:bold;color:#22c55e;transform:scale(.7);opacity:0;
  text-shadow:0 0 40px rgba(34,197,94,.7);animation:countPop 1s ease forwards;
}
@keyframes countPop{0%{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}

#finalBox{
  margin-top:24px;padding:22px;background:var(--panel);border:1px solid var(--border);border-radius:20px;text-align:center;
  opacity:0;transform:translateY(20px) scale(.98);transition:opacity .5s ease,transform .5s ease;
}
#finalBox.show{opacity:1;transform:translateY(0) scale(1)}
.final-message{margin-top:16px;padding:14px;border-left:4px solid var(--accent);background:var(--panel);border-radius:12px;font-style:italic;line-height:1.6}
.final-actions{margin-top:20px;display:grid;gap:14px}
.final-actions button{
  position:relative;overflow:hidden;padding:14px;border:none;border-radius:16px;cursor:pointer;
  font-size:1rem;font-weight:600;letter-spacing:.5px;transition:all .25s ease;color:var(--act-text);
  background:var(--act-bg);box-shadow:0 4px 14px var(--act-sh);
}
.final-actions button:hover{transform:translateY(-2px);box-shadow:0 8px 22px var(--act-sh-h);filter:brightness(1.08)}
.final-actions button:active{transform:scale(.96)}

.review-item{opacity:0;transform:translateY(25px);transition:opacity .5s ease,transform .5s ease}
.review-item.show{opacity:1;transform:translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10000}

/* ===== Ringkasan akhir: lingkaran progres ===== */
.ring-wrap{position:relative;width:170px;height:170px;margin:6px auto 18px}
.ring{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--border2);stroke-width:10}
.ring-fg{
  fill:none;stroke:var(--ringc,#22c55e);stroke-width:10;stroke-linecap:round;
  filter:drop-shadow(0 0 5px var(--ringc,#22c55e));
  transition:stroke-dashoffset 1.4s cubic-bezier(.22,.61,.36,1);
}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#finalScore{font-size:2.8rem;line-height:1;color:var(--ringc,var(--accent2))}
.ring-center small{color:var(--muted);margin-top:4px;font-size:.85rem}
.final-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:12px 8px;border-radius:14px;background:var(--hover);border:1px solid var(--border2);display:flex;flex-direction:column;gap:4px}
.stat b{font-size:1.45rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.s-ok b{color:var(--accent2)}
.s-bad b{color:#ef4444}

/* ===== Tab filter review ===== */
.review-tabs{
  position:sticky;top:0;z-index:3;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  padding:10px 0 12px;margin-bottom:8px;background:var(--overlay);
}
.rtab{
  padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-size:.9rem;font-family:inherit;cursor:pointer;transition:.25s ease;
}
.rtab:hover{border-color:var(--accent)}
.rtab.active{background:var(--act-bg);color:var(--act-text);border-color:transparent}

/* ===== Mode cerah: kartu info satu keluarga warna (navy) ===== */
[data-theme="light"] .icard{
  background:linear-gradient(145deg,#1d4ed8,#1e3a8a 60%,#172554);
  box-shadow:0 0 16px rgba(30,58,138,.3);
}
</style>
</head>

<body>
<div class="orb o1"></div><div class="orb o2"></div>

<div class="quiz-box">

<div id="timerBox" class="hidden">
  ⏳ Waktu: <span id="timeNum">20</span> detik
  <div id="progressWrap"><div id="progressBar"></div></div>
</div>

<div id="startScreen">
  <div class="theme-switch">
    <button id="themeDark" data-theme-btn="dark" title="Tema gelap" aria-label="Tema gelap">🌙</button>
    <button id="themeLight" data-theme-btn="light" title="Tema cerah" aria-label="Tema cerah">☀️</button>
  </div>

  <h2>Selamat datang di</h2>
  <h2 class="glow-title">kuis AFHIMNA</h2>

  <div class="info-grid">
    <div class="icard c-tema"><small>Tema</small><b id="infoTema">...</b><span></span></div>
    <div class="icard c-kitab"><small>Kitab</small><b id="infoKitab">...</b><small class="ar"></small></div>
    <div class="icard c-fashl"><small>Fashl</small><b id="infoFashl">...</b><small class="ar"></small></div>
    <div class="icard c-jumlah"><small>Jumlah soal</small><b id="infoJumlah">...</b><small class="ar"></small></div>
    <div class="icard c-waktu"><small>Waktu per soal</small><b id="infoWaktu">...</b><small class="ar"></small></div>
  </div>

  <p class="info-rule">
    Soal yang tidak dijawab sebelum waktu habis dihitung salah.
  </p>

  <h2>Sudah siap?</h2>
  <button id="startBtn" disabled>Mulai</button>
</div>

<div id="quiz" class="hidden">
  <div id="questionText"></div>
  <div id="answers" class="answer-buttons"></div>

<div id="reviewBox" class="hidden"></div>

  <div class="score-board">
    Skor: <b id="scoreNum">0</b> / 100<br>
    Benar: <span id="cNum">0</span> | Salah: <span id="wNum">0</span>
  </div>

  <div id="result" class="hidden"></div>
  <button id="nextBtn" class="hidden">Selanjutnya</button>
</div>
<div id="finalBox" class="hidden">
  <h3>📊 Ringkasan Akhir</h3>

  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 120 120">
      <circle class="ring-bg" cx="60" cy="60" r="52"/>
      <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"/>
    </svg>
    <div class="ring-center"><b id="finalScore">0</b><small>/ 100</small></div>
  </div>

  <div class="final-stats">
    <div class="stat s-ok"><b id="finalCorrect">0</b><span>Benar</span></div>
    <div class="stat s-bad"><b id="finalWrong">0</b><span>Salah</span></div>
    <div class="stat"><b><span id="finalPercent">0</span>%</b><span>Persentase</span></div>
    <div class="stat"><b id="finalTime">0:00</b><span>Waktu penyelesaian</span></div>
  </div>

  <div id="finalMessage" class="final-message"></div>
  <div class="final-actions">
  <button id="retryBtn">Ulangi Kuis</button>
  <button id="explainBtn">Penjelasan Tambahan</button>
  <button id="shareBtn">Share nilai</button>
  <button id="HomeBtn">Halaman utama</button>
</div>
</div>
</div>

<audio id="DipikirSound" src="Dipikir.mp3?v=3" preload="auto"></audio>
<audio id="alarmSound" src="alarm.mp3?v=3" preload="auto"></audio>
<audio id="correctSound" src="correct.mp3?v=3" preload="auto"></audio>
<audio id="wrongSound" src="wrong.mp3?v=3" preload="auto"></audio>
<script>
/* ===== PENGATURAN: semua diambil dari config.json (tidak perlu edit di sini) ===== */
let TIME_LIMIT = 20000;
let INFO = {
  tema: "-",
  kitab: "-",
  fashl: "-",
  linkPenjelasan: "#",
  linkHome: "#"
};

/* ===== TEMA (default: gelap) ===== */
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("afhimna-theme",t)}catch(e){}
  document.querySelectorAll("[data-theme-btn]").forEach(b=>{
    b.classList.toggle("active",b.dataset.themeBtn===t);
  });
}
let savedTheme="dark";
try{savedTheme=localStorage.getItem("afhimna-theme")||"dark"}catch(e){}
setTheme(savedTheme==="light"?"light":"dark");
document.querySelectorAll("[data-theme-btn]").forEach(b=>{
  b.addEventListener("click",()=>setTheme(b.dataset.themeBtn));
});

/* ===== EFEK: ripple, bump, confetti ===== */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b||b.disabled||b.dataset.themeBtn)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/2,sp=document.createElement("span");
  sp.className="ripple";
  sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  if(getComputedStyle(b).position==="static")b.style.position="relative";
  b.style.overflow="hidden";
  b.appendChild(sp);
  setTimeout(()=>sp.remove(),600);
});
function bump(el){
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}
function confetti(){
  const c=document.createElement("canvas");
  c.id="confetti";
  c.width=innerWidth;c.height=innerHeight;
  document.body.appendChild(c);
  const x=c.getContext("2d"),cols=["#22c55e","#38bdf8","#f59e0b","#ef4444","#a855f7"];
  const ps=Array.from({length:140},()=>({
    x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,
    s:5+Math.random()*6,vx:-2+Math.random()*4,vy:2+Math.random()*4,
    r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.floor(Math.random()*cols.length)]
  }));
  let f=0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);
      x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();
    });
    if(++f<260)requestAnimationFrame(loop);else c.remove();
  })();
}

let data=[],idx=0,score=0,correct=0,wrongCount=0;
let currentOptions=[],timer=null,timerActive=false;

let quizStartTime = null;
let quizEndTime = null;
let quizDuration = 0; // dalam detik

let reviewLog=[];
let countdownInterval=null,remaining=TIME_LIMIT/1000;

let alarmPlayed = false;

const timeNum=document.getElementById("timeNum"),
progressBar=document.getElementById("progressBar"),
DipikirSound=document.getElementById("DipikirSound"),
alarmSound=document.getElementById("alarmSound"),
correctSound=document.getElementById("correctSound"),
wrongSound=document.getElementById("wrongSound"),
scoreNum=document.getElementById("scoreNum"),
cNum=document.getElementById("cNum"),
wNum=document.getElementById("wNum"),
questionText=document.getElementById("questionText"),
answers=document.getElementById("answers"),
result=document.getElementById("result"),
nextBtn=document.getElementById("nextBtn"),
quiz=document.getElementById("quiz"),
quizBox=document.querySelector(".quiz-box"),
startScreen=document.getElementById("startScreen"),
startBtn=document.getElementById("startBtn"),
timerBox=document.getElementById("timerBox");

/* ===== MUAT config.json + soal.json ===== */
Promise.all([
  fetch("config.json").then(r=>{
    if(!r.ok) throw new Error("config.json tidak ditemukan");
    return r.json();
  }),
  fetch("soal.json").then(r=>{
    if(!r.ok) throw new Error("soal.json tidak ditemukan");
    return r.json();
  })
]).then(([cfg,d])=>{

  INFO = Object.assign(INFO, cfg);

  if(cfg.waktuPerSoal && Number(cfg.waktuPerSoal) > 0){
    TIME_LIMIT = Number(cfg.waktuPerSoal) * 1000;
  }
  remaining = TIME_LIMIT / 1000;
  timeNum.textContent = remaining;

  document.getElementById("infoTema").textContent = INFO.tema;
  document.getElementById("infoKitab").textContent = INFO.kitab;
  document.getElementById("infoFashl").textContent = INFO.fashl;
  document.getElementById("infoWaktu").innerHTML = (TIME_LIMIT/1000) + "<small>detik</small>";

  data = d;
  document.getElementById("infoJumlah").textContent = d.length;
  startBtn.disabled = false;

}).catch(err=>{
  console.error(err);
  document.getElementById("infoTema").textContent = "-";
  document.getElementById("infoKitab").textContent = "-";
  document.getElementById("infoFashl").textContent = "-";
  document.getElementById("infoJumlah").textContent = "-";
  document.getElementById("infoWaktu").textContent = "-";
  alert("Gagal memuat config.json atau soal.json. Cek nama file dan format JSON-nya.");
});

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function startTimer(){

  alarmPlayed = false;

  quizBox.classList.remove("timer-warning","timer-danger");
  alarmSound.pause();
  alarmSound.currentTime = 0;

  clearTimeout(timer);
  clearInterval(countdownInterval);

  timerActive = true;
  remaining = TIME_LIMIT / 1000;
  timeNum.textContent = remaining;
  progressBar.style.width = "100%";

  DipikirSound.currentTime = 0;
  DipikirSound.play().catch(()=>{});

  countdownInterval = setInterval(()=>{
    if(!timerActive) return;

    remaining--;
    timeNum.textContent = remaining;

    progressBar.style.width = (remaining / (TIME_LIMIT/1000)) * 100 + "%";
    progressBar.className = "";
    progressBar.classList.add(
      remaining > 10 ? "progress-safe" :
      remaining > 5  ? "progress-warn" :
                       "progress-danger"
    );

    if(remaining <= 3){

      quizBox.classList.remove("timer-warning");
      quizBox.classList.add("timer-danger");

      if(!alarmPlayed){
        alarmSound.currentTime = 0;
        alarmSound.play().catch(()=>{});
        alarmPlayed = true;
      }
    }
    else if(remaining <= 5){
      quizBox.classList.add("timer-warning");
    }

    if(remaining <= 0){
      clearInterval(countdownInterval);
    }
  }, 1000);

  timer = setTimeout(()=>{
    if(timerActive) timeUp();
  }, TIME_LIMIT);
}

function pauseTimer(){
  timerActive = false;
  clearTimeout(timer);
  clearInterval(countdownInterval);

  quizBox.classList.remove("timer-warning","timer-danger");
  stopAllSounds();
}

function show(){
  questionText.classList.remove("show");
  answers.classList.remove("show");
  questionText.classList.add("question-fade");
  answers.classList.add("question-fade");

  setTimeout(()=>{
    const q=data[idx];

    questionText.textContent=`Soal ${idx+1}: ${q.question}`;
    answers.innerHTML="";
    startTimer();

    currentOptions=["A","B","C","D","E"].map((l,i)=>({
      text:q["option_"+l],
      isCorrect:i===Number(q.answer_index)
    }));
    shuffle(currentOptions);

    currentOptions.forEach(opt=>{
      const b=document.createElement("button");
      b.textContent=opt.text;
      b.onclick=()=>check(b,opt);
      answers.appendChild(b);
    });

    requestAnimationFrame(()=>{
      questionText.classList.add("show");
      answers.classList.add("show");
    });

    result.classList.add("hidden");
    nextBtn.classList.add("hidden");
    nextBtn.disabled = false;
  },200);
}

function check(btn,opt){
  if(!timerActive)return;
  pauseTimer();
  stopAllSounds();

  reviewLog.push({
    soal: data[idx].question,
    jawabanBenar: data[idx]["option_" + ["A","B","C","D","E"][Number(data[idx].answer_index)]],
    jawabanUser: opt.text,
    status: opt.isCorrect ? "benar" : "salah",
    penjelasan: data[idx].explanation
  });

  [...answers.children].forEach((b,i)=>{
    if(currentOptions[i].isCorrect)b.classList.add("correct");
    if(b===btn&&!opt.isCorrect)b.classList.add("wrong");
    b.disabled=true;
  });

  result.classList.remove("hidden");
  result.classList.add("show");
  setTimeout(focusResult, 200);

  if(opt.isCorrect){
    correct++;
    score=Math.round(correct*100/data.length);

    correctSound.currentTime = 0;
    correctSound.play().catch(()=>{});

    result.innerHTML=`<div class="correct-text">✔ Jawaban Benar</div><div class="explain">${data[idx].explanation}</div>`;
  }else{
    wrongCount++;

    wrongSound.currentTime = 0;
    wrongSound.play().catch(()=>{});

    result.innerHTML=`<div class="wrong-text">✖ Jawaban Salah</div><div class="explain">${data[idx].explanation}</div>`;
  }

  scoreNum.textContent=score;
  cNum.textContent=correct;
  wNum.textContent=wrongCount;
  bump(opt.isCorrect?scoreNum:wNum);
  bump(opt.isCorrect?cNum:wNum);
  nextBtn.classList.remove("hidden");
}

function timeUp(){
  pauseTimer();
  stopAllSounds();

  wrongSound.currentTime = 0;
  wrongSound.play().catch(()=>{});

  DipikirSound.pause();
  DipikirSound.currentTime = 0;

  quizBox.classList.remove("timer-warning","timer-danger");
  alarmSound.pause();
  alarmSound.currentTime = 0;

  reviewLog.push({
    soal: data[idx].question,
    jawabanBenar: data[idx]["option_" + ["A","B","C","D","E"][Number(data[idx].answer_index)]],
    jawabanUser: "(tidak dijawab)",
    status: "timeout",
    penjelasan: data[idx].explanation
  });

  wrongCount++;
  result.classList.remove("hidden");
  result.classList.add("show");
  setTimeout(focusResult, 200);

  result.innerHTML = `
    <div class="wrong-text">⏰ Waktu habis</div>
    <div class="explain">${data[idx].explanation}</div>
  `;

  wNum.textContent = wrongCount;
  bump(wNum);
  nextBtn.classList.remove("hidden");
}

nextBtn.onclick = ()=>{
  if(nextBtn.disabled) return;
  nextBtn.disabled = true;
  idx++;

  if(idx < data.length){
    // masih ada soal → lanjut kuis
    show();
  }else{
    // durasi dihentikan di sini, sebelum ulasan dibuka
    quizEndTime = Date.now();
    quizDuration = Math.floor((quizEndTime - quizStartTime) / 1000);

    quiz.classList.add("hidden");
    nextBtn.classList.add("hidden");
    timerBox.classList.add("hidden");

    showReview();
  }
};

startBtn.onclick=()=>{

  DipikirSound.load();
  alarmSound.load();
  correctSound.load();
  wrongSound.load();

  startScreen.classList.add("hidden");

  startCountdown(()=>{

    quizStartTime = Date.now();

    quiz.classList.remove("hidden");
    quiz.classList.add("fade-scale");
    requestAnimationFrame(()=>quiz.classList.add("show"));
    timerBox.classList.remove("hidden");
    show();
  });
};

window.addEventListener("load",()=>document.body.classList.add("page-ready"));

function focusResult(){
  result.scrollIntoView({behavior:"smooth",block:"start"});
}
function showReview(){
  const overlay=document.createElement("div");
  overlay.id="reviewOverlay";
  overlay.style.cssText=`
    position:fixed;
    inset:0;
    background:var(--overlay);
    overflow-y:auto;
    z-index:9999;
    padding:24px;
    color:var(--text);
  `;

  const nSalah = reviewLog.filter(r=>r.status==="salah").length;
  const nTimeout = reviewLog.filter(r=>r.status==="timeout").length;

  let html=`
    <div style="max-width:720px;margin:auto">
      <h2 style="text-align:center;margin-bottom:12px">
        Ulasan Jawaban
      </h2>
      <div class="review-tabs">
        <button class="rtab active" data-filter="all">Semua (${reviewLog.length})</button>
        <button class="rtab" data-filter="salah">Salah (${nSalah})</button>
        <button class="rtab" data-filter="timeout">Waktu habis (${nTimeout})</button>
      </div>
      <div id="reviewEmpty" class="hidden" style="text-align:center;color:var(--muted);padding:24px">
        Tidak ada soal pada kategori ini.
      </div>
  `;

  reviewLog.forEach((r,i)=>{
    const color=
      r.status==="benar" ? "#22c55e" :
      r.status==="timeout" ? "#eab308" :
      "#ef4444";

    html+=`
      <div class="review-item" data-status="${r.status}" style="
      background:var(--panel);
      border:1px solid var(--border);
      border-left:6px solid ${color};
      border-radius:16px;
      padding:16px;
      margin-bottom:16px;
">
        <div style="font-weight:bold;margin-bottom:8px">
          ${i+1}. ${r.soal}
        </div>
        <div>Jawaban kamu: <b>${r.jawabanUser}</b></div>
        <div>Jawaban benar: <b>${r.jawabanBenar}</b></div>
        <div style="margin:6px 0;color:${color}">
          Status: ${r.status.toUpperCase()}
        </div>
        <div style="
  margin-top:10px;
  padding:12px;
  background:var(--panel);
  border-left:4px solid var(--accent);
  border-radius:10px;
  text-align:justify;
">
  ${r.penjelasan}
</div>
      </div>
    `;
  });

  html+=`
      <button id="closeReview"
        style="
          width:100%;
          padding:14px;
          border:none;
          border-radius:16px;
          background:linear-gradient(135deg,#2563eb,#38bdf8);
          color:white;
          font-size:1rem;
          cursor:pointer;
        ">
        Tutup Review
      </button>
    </div>
  `;

  overlay.innerHTML=html;
  document.body.appendChild(overlay);
  const items = overlay.querySelectorAll(".review-item");

  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("show");
        observer.unobserve(entry.target);
      }
    });
  },{
    threshold:0.2
  });

  items.forEach(item=>{
    observer.observe(item);
  });

  overlay.querySelectorAll(".rtab").forEach(tab=>{
    tab.addEventListener("click",()=>{
      overlay.querySelectorAll(".rtab").forEach(t=>t.classList.toggle("active",t===tab));
      const f = tab.dataset.filter;
      let shown = 0;
      items.forEach(it=>{
        const ok = f === "all" || it.dataset.status === f;
        it.style.display = ok ? "" : "none";
        if(ok) shown++;
      });
      overlay.querySelector("#reviewEmpty").classList.toggle("hidden", shown > 0);
      overlay.scrollTo({top:0,behavior:"smooth"});
    });
  });

  requestAnimationFrame(()=>{
    overlay.classList.add("show");
  });

  document.getElementById("closeReview").onclick=()=>{

    overlay.classList.remove("show");

    setTimeout(()=>{

      overlay.remove();

      showGlobalSummary();

    },450);
  };

  overlay.scrollTo({top:0,behavior:"smooth"});
}
function startCountdown(onFinish){
  const overlay=document.createElement("div");
  overlay.id="countdownOverlay";

  const num=document.createElement("div");
  num.id="countdownNum";

  overlay.appendChild(num);
  document.body.appendChild(overlay);

  let count=3;

  requestAnimationFrame(()=>overlay.classList.add("show"));

  const run=()=>{
    num.textContent = count > 0 ? count : "Mulai";
    num.style.animation="none";
    num.offsetHeight; // reset animation
    num.style.animation="countPop 1s ease forwards";

    if(count < 0){
      overlay.classList.remove("show");
      setTimeout(()=>{
        overlay.remove();
        onFinish();
      },400);
      return;
    }

    count--;
    setTimeout(run,1000);
  };

  run();
}
function getFinalMessage(percent){
  if(percent === 100){
    return "MasyaAllah, semua jawaban benar. Penguasaan materi sangat baik.";
  }
  if(percent >= 75){
    return "Hasil lumayan baik. Tinggal sedikit penguatan.";
  }
  if(percent >= 50){
    return "Cukup baik. Perlu pengulangan agar pemahaman semakin kokoh.";
  }
  if(percent >= 25){
    return "Masih perlu belajar. Jangan menyerah, perbaiki dan ulangi kembali.";
  }
  return "Jangan berkecil hati. Jadikan hasil ini sebagai motivasi.";
}
function stopAllSounds(){
  DipikirSound.pause();
  DipikirSound.currentTime = 0;

  alarmSound.pause();
  alarmSound.currentTime = 0;

  correctSound.pause();
  correctSound.currentTime = 0;

  wrongSound.pause();
  wrongSound.currentTime = 0;
}
function animateRing(sc,pct){
  const C = 2 * Math.PI * 52;
  const box = document.getElementById("finalBox");
  const fg = document.getElementById("ringFg");
  const num = document.getElementById("finalScore");
  const color = pct >= 85 ? "#22c55e" : pct >= 60 ? "#eab308" : "#ef4444";

  box.style.setProperty("--ringc", color);
  fg.style.strokeDasharray = C;
  fg.style.strokeDashoffset = C;

  setTimeout(()=>{
    fg.style.strokeDashoffset = C * (1 - Math.min(sc,100) / 100);
  },250);

  const dur = 1400, t0 = performance.now();
  (function tick(now){
    const p = Math.min((now - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    num.textContent = Math.round(sc * e);
    if(p < 1) requestAnimationFrame(tick);
  })(t0);
}
function showGlobalSummary(){

  const total = correct + wrongCount;
  const percent = total === 0 ? 0 : Math.round((correct / total) * 100);

  const minutes = Math.floor(quizDuration / 60);
  const seconds = quizDuration % 60;
  const formattedTime = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

  document.getElementById("finalCorrect").textContent = correct;
  document.getElementById("finalWrong").textContent = wrongCount;
  document.getElementById("finalPercent").textContent = percent;
  document.getElementById("finalTime").textContent = formattedTime;

  document.getElementById("finalMessage").textContent =
    getFinalMessage(percent);

  const box = document.getElementById("finalBox");
  box.classList.remove("hidden");

  requestAnimationFrame(()=>{
    box.classList.add("show");
  });

  animateRing(score, percent);

  box.scrollIntoView({behavior:"smooth",block:"center"});

  if(percent >= 75) setTimeout(confetti,500);
}
document.addEventListener("click", function(e){

  const percent = document.getElementById("finalPercent")?.textContent || "";

  if(e.target.id === "retryBtn"){
    location.reload();
  }

  if(e.target.id === "explainBtn"){
    window.open(INFO.linkPenjelasan, "_blank");
  }

  if(e.target.id === "HomeBtn"){
    window.open(INFO.linkHome, "_blank");
  }

  if(e.target.id === "shareBtn"){

    generateProImage((blob) => {

      const file = new File([blob], "Nilai-kuis-AFHIMNA.png", {
        type: "image/png"
      });

      const shareText = `Saya mendapat nilai ${percent}% di Kuis AFHIMNA! Kunjungi: ${INFO.linkHome}`;

      if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){

        navigator.share({
          title: "Nilai-kuis-AFHIMNA",
          text: shareText,
          files: [file]
        }).catch(()=>{});

      } else {

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Nilai-kuis-AFHIMNA.png";
        a.click();

        alert("Gambar diunduh. Silakan bagikan secara manual.");
      }

    });

  }
});
async function generateProImage(callback){

  if (document.fonts) {
    await document.fonts.load('700 40px "Bokor"');
    await document.fonts.load('700 40px "Playfair Display"');
    await document.fonts.ready;
  }

  const template = new Image();

  template.crossOrigin = "anonymous";
  template.src = "share-template.jpg";

  template.onload = function(){

    const scale = 2;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = template.width * scale;
    canvas.height = template.height * scale;
    ctx.scale(scale, scale);

    ctx.drawImage(template, 0, 0);

    const w = template.width;
    const h = template.height;
    const centerX = w / 2;
    const rightX = w * 0.88;

    const percent = parseInt(document.getElementById("finalPercent").textContent);
    const waktu = document.getElementById("finalTime").textContent;
    const SoalFashl = INFO.fashl;

    let gradeText="", gradeColor="";

    if(percent >= 85){
      gradeText = "EXCELLENT";
      gradeColor = "#00ffd5";
    } else if(percent >= 60){
      gradeText = "GOOD JOB";
      gradeColor = "#ffd700";
    } else{
      gradeText = "KEEP LEARNING";
      gradeColor = "#ff4d4d";
    }

    ctx.font = "700 250px 'Playfair Display'";
    ctx.textAlign = "center";
    ctx.fillStyle = gradeColor;
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.fillText(percent + "", centerX, h*0.30);

    ctx.font = "40px 'Playfair Display'";
    ctx.fillStyle = gradeColor;
    ctx.fillText(gradeText, centerX, h*0.40);

    // =========================
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w*0.25, h*0.46);
    ctx.lineTo(w*0.75, h*0.46);
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.font = "600 60px 'Bokor'";
    ctx.fillStyle = "#ffffff";

    const leftX = w * 0.24;
    const startY = h * 0.60;
    const lineGap = h * 0.05;
    const rows = [
      { label: "Jawaban Benar", value: correct },
      { label: "Jawaban Salah", value: wrongCount },
      { label: "Durasi pengerjaan", value: waktu },
      { label: "Fashl", value: SoalFashl }
    ];

    let maxWidth = 0;
    rows.forEach(row => {
      const width = ctx.measureText(row.label).width;
      if (width > maxWidth) maxWidth = width;
    });

    const colonX = leftX + maxWidth + 20;
    const valueX = colonX + 40;

    rows.forEach((row, i) => {
      const y = startY + (i * lineGap);
      ctx.fillText(row.label, leftX, y);
      ctx.fillText(":", colonX, y);
      ctx.fillText(row.value, valueX, y);
    });

    canvas.toBlob(blob => callback(blob), "image/png", 1.0);
  };
}
